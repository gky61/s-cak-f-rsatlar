version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: sicak_firsatlar_bot
    restart: always  # Çökerse veya sunucu yeniden başlarsa otomatik başlat
    volumes:
      - ./logs:/app/logs  # Logları dışarı aktar
      - ./sessions:/app/sessions  # Session dosyalarını koru (dizin olarak)
      - ./serviceAccountKey.json:/app/serviceAccountKey.json  # Firebase key dosyası
    environment:
      - TZ=Europe/Istanbul
      - TELEGRAM_SESSION_NAME=telegram_session_new
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


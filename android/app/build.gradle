plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing key yapılandırması
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.sicakfirsatlar.sicak_firsatlar"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.sicakfirsatlar.sicak_firsatlar"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders += [
            applicationName: "android.app.Application",
            admob_app_id: "ca-app-pub-3940256099942544~3347511713" // Google Official Test App ID (Fallback)
        ]
        ndk {
            // Emülatör (x86_64) ve fiziksel cihaz (arm64-v8a, armeabi-v7a) mimari uyumluluğu (UnsatisfiedLinkError önleyici)
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationId "com.sicakfirsatlar.sicak_firsatlar"
            resValue "string", "app_name", "FırsatKolik Dev"
            manifestPlaceholders += [
                applicationName: "android.app.Application",
                admob_app_id: "ca-app-pub-3940256099942544~3347511713" // Google Official Android Sample App ID
            ]
        }
        prod {
            dimension "default"
            applicationId "com.firsatkolik.app"
            resValue "string", "app_name", "FırsatKolik"
            manifestPlaceholders += [
                applicationName: "android.app.Application",
                admob_app_id: "ca-app-pub-6853997017739651~8861215767" // Real FırsatKolik Android App ID
            ]
        }
    }

    signingConfigs {
        // Release signing key yapılandırması
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Release key varsa kullan, yoksa fail-closed durdur (asla debug key ile release imzalama)
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                boolean isReleaseTask = gradle.startParameter.taskNames.any { 
                    it.toLowerCase().contains("release") || it.toLowerCase().contains("bundle") 
                }
                if (isReleaseTask) {
                    throw new GradleException("❌ KRİTİK DERLEME HATASI: Release derlemesi için key.properties dosyası zorunludur! Debug anahtarıyla release paketi üretilemez.")
                }
                signingConfig null
            }
            
            // ProGuard/R8 AÇIK - Release build optimizasyonu için
            // NOT: ProGuard rules dosyası güncellendi, AdMob ve Firebase kuralları eklendi
            // NOT: Release build yapmadan önce test edin!
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Crash raporları için debug bilgileri koru
            ndk {
                debugSymbolLevel 'FULL'
            }

            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
        
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.appcompat:appcompat:1.6.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}


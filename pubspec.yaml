name: sicak_firsatlar
description: Sıcak Fırsatlar - Topluluk temelli indirim ve kampanya paylaşım uygulaması
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase paketleri
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.20.0
  firebase_messaging: ^14.7.10
  firebase_app_check: ^0.2.1+15
  firebase_crashlytics: 3.5.7
  
  # Authentication paketleri
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  
  # UI ve yardımcı paketler
  intl: ^0.20.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  
  # Bildirimler
  flutter_local_notifications: ^17.0.0
  
  # Link ve URL işlemleri
  url_launcher: ^6.2.4
  http: ^1.2.0
  share_plus: ^9.0.0
  path_provider: ^2.1.2
  receive_sharing_intent: 1.8.1
  
  # HTML parsing ve metadata
  html: ^0.15.4
  metadata_fetch: ^0.4.2
  
  # Shimmer effect for skeleton loading
  shimmer: ^3.0.0
  
  # SharedPreferences for storing user preferences
  shared_preferences: ^2.2.2

  # Connectivity - İnternet bağlantı kontrolü
  connectivity_plus: ^6.0.3

  # AdMob - Reklamlar için
  google_mobile_ads: ^5.0.0
  firebase_performance: ^0.9.4+7
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/data/
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/store-icon.png"
  adaptive_icon_background: "assets/background.png"
  adaptive_icon_foreground: "assets/foreground.png"

flutter_native_splash:
  color: "#FF6B35"
  image: "assets/foreground.png"
  color_dark: "#1A1A1A"
  image_dark: "assets/foreground.png"
  android_12:
    color: "#FF6B35"
    image: "assets/foreground.png"
    color_dark: "#1A1A1A"
    image_dark: "assets/foreground.png"
  android: true
  ios: true
  web: false


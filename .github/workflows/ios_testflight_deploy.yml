name: iOS TestFlight Deployment

# ==============================================================================
# FırsatKolik — iOS TestFlight Otomatik Derleme ve Dağıtım İş Akışı
# ==============================================================================
# ⚠️ DİKKAT: GitHub Actions private repolarda macOS runner'lar için 10x dakika
# çarpanı uygular (Aylık 2000 Linux dk = 200 macOS dk).
# Bu nedenle iş akışı:
# 1. Yalnızca manuel (workflow_dispatch) tetiklenir (her push'ta kota yemez).
# 2. CocoaPods önbellekleme ile derleme süresini 15 dk'dan ~8 dk'ya indirir.
# 3. Fastlane skip_waiting_for_build_processing ile Apple işleme süresini beklemez.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Derleme Ortamı (Flavor)'
        required: true
        default: 'prod'
        type: choice
        options:
          - 'prod'
          - 'dev'
      upload_to_testflight:
        description: 'TestFlight’a Otomatik Yüklensin mi?'
        required: true
        default: true
        type: boolean

jobs:
  build-and-deploy-ios:
    name: Build & Deploy iOS (${{ inputs.flavor }})
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # 1. Depoyu Klonla (Node.js 24 uyumlu)
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      # 2. Modern Xcode 26 ve iOS 26 SDK Ortamını Seç
      - name: 🍏 Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 3. Flutter Ortamını Kur (Önbellekli)
      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Flutter Yapılandırması ve Bağımlılıkları Yükle
      - name: 📦 Configure Flutter & Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter precache --ios
          python3 ios_ci/scripts/patch_modular_headers.py


      # 5. iOS Uyumluluk ve Kimlik Doğrulama Birim Testlerini Koş
      - name: 🧪 Run iOS Compatibility & Auth Tests
        run: |
          cp ios/Runner/GoogleService-Info-prod.plist ios/Runner/GoogleService-Info.plist
          flutter test test/ios_compatibility_test.dart test/ios_auth_test.dart

      # 6. CocoaPods Önbelleği (Build süresini yarı yarıya düşürür, kotayı korur - Node 24)
      - name: ⚡ Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # 7. Apple Dağıtım Sertifikası ve Keychain Kurulumu
      - name: 🔐 Setup Apple Keychain & Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          chmod +x ios_ci/scripts/setup_keychain.sh
          bash ios_ci/scripts/setup_keychain.sh

      # 8. iOS IPA Paketini Derle (Flutter varsayılan Runner şemasını kullanır, ortam FLAVOR dart-define ile seçilir)
      - name: 🔨 Build iOS IPA (${{ inputs.flavor }})
        run: |
          echo "=================================================================="
          echo "Building iOS IPA for flavor: ${{ inputs.flavor }}"
          echo "Apple Bundle Identifier: com.firsatkolik.app (TestFlight Resmi Kimliği)"
          echo "=================================================================="

          # SPM'i devre dışı bırakıp stabil CocoaPods derlemesini garanti et
          flutter config --no-enable-swift-package-manager

          # TestFlight için daima kayıtlı com.firsatkolik.app kimliğini kullan
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.sicakfirsatlar\.sicakFirsatlar;/PRODUCT_BUNDLE_IDENTIFIER = com.firsatkolik.app;/g" ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true

          # İlgili ortama (flavor) ait GoogleService-Info.plist dosyasını bağla
          if [ "${{ inputs.flavor }}" = "dev" ] && [ -f "ios/Runner/GoogleService-Info-dev.plist" ]; then
            cp "ios/Runner/GoogleService-Info-dev.plist" "ios/Runner/GoogleService-Info.plist"
            echo "Using GoogleService-Info-dev.plist for DEV build"
          elif [ -f "ios/Runner/GoogleService-Info-prod.plist" ]; then
            cp "ios/Runner/GoogleService-Info-prod.plist" "ios/Runner/GoogleService-Info.plist"
            echo "Using GoogleService-Info-prod.plist for PROD build"
          fi

          flutter build ipa \
            --build-number=${{ github.run_number }} \
            --dart-define=FLAVOR=${{ inputs.flavor }} \
            --release \
            --export-options-plist=ios_ci/ExportOptions_${{ inputs.flavor }}.plist

      # 9. Derlenen IPA Dosyasını GitHub Artifact Olarak Sakla (Node.js 24 uyumlu)
      - name: 💾 Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firsatkolik-${{ inputs.flavor }}-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      # 10. Apple TestFlight'a Yükle (Fastlane + App Store Connect API)
      - name: 🚀 Upload to Apple TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          chmod +x ios_ci/scripts/upload_testflight.sh
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          bash ios_ci/scripts/upload_testflight.sh "$IPA_FILE"
